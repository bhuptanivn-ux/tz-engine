name: Update OHLC CSVs

on:
  schedule:
    # Daily after Indian cash close + buffer for adjusted/official closes.
    # 19:00 IST = 13:30 UTC
    - cron: "30 13 * * *"
    # Weekly catch-up after the last working day of the week (Saturday 08:00 IST).
    # 08:00 IST = 02:30 UTC Saturday
    - cron: "30 2 * * 6"
    # Monthly (and yearly on 1 Jan) after the period has ended. 08:00 IST on the 1st.
    - cron: "30 2 1 * *"
  workflow_dispatch:
    inputs:
      timeframe:
        description: "Timeframe to refresh"
        required: true
        default: auto
        type: choice
        options:
          - auto
          - DAILY
          - WEEKLY
          - MONTHLY
          - YEARLY

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install data dependencies
        run: pip install -r requirements-data.txt

      - name: Choose timeframe
        id: tf
        run: |
          INPUT="${{ github.event.inputs.timeframe }}"
          if [ -z "$INPUT" ]; then
            INPUT="auto"
          fi
          echo "timeframe=$INPUT" >> "$GITHUB_OUTPUT"

      - name: Refresh OHLC
        run: python3 scripts/tv_ohlc_update.py --timeframe "${{ steps.tf.outputs.timeframe }}" --sleep 0.08 --retries 2

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No CSV changes."
            exit 0
          fi
          git commit -m "Update ${{ steps.tf.outputs.timeframe }} OHLC after session close"
          git push
